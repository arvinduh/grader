[package]
name = "grader"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Brightspace grading automation CLI"

[[bin]]
name = "bsg"
path = "src/main.rs"

[dependencies]
axoupdater = { workspace = true, optional = true }
bsg-ingest = { workspace = true }
bsg-ledger = { workspace = true }
bsg-notebook = { workspace = true }
bsg-runner = { workspace = true }
bsg-workspace = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
semver = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { workspace = true }

[features]
default = ["update"]
update = ["dep:axoupdater", "dep:semver", "dep:tempfile", "dep:tokio"]

[lints]
workspace = true
