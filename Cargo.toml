[workspace]
resolver = "2"
members = [
  "crates/bsg",
  "crates/ingest",
  "crates/ledger",
  "crates/notebook",
  "crates/runner",
  "crates/workspace",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
repository = "https://github.com/arvinduh/grader"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"
len_without_is_empty = "warn"
new_without_default = "warn"
should_implement_trait = "warn"
wrong_self_convention = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
# Suppress noisy pedantic lints unsuited for CLI & arithmetic
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = [
  "github_releases",
] }
bsg-ingest = { path = "crates/ingest" }
bsg-ledger = { path = "crates/ledger" }
bsg-notebook = { path = "crates/notebook" }
bsg-runner = { path = "crates/runner" }
bsg-workspace = { path = "crates/workspace" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
file_type_enum = "3.0.1"
scraper = "0.27.0"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
] }
zip = "8.6.0"

# Config for 'dist' (cargo-dist): GitHub Releases are the only channel - no
# crates.io publish.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
install-path = ["~/.local/bin", "~/.cargo/bin"]
install-updater = false
source-tarball = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
